name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repo only ever holds placeholder firebase-config.js / ai-bot-plugin config.js files
      # (see each file's own comment). The real values live in repository secrets and are written
      # into a throwaway staged copy here - never back into the checked-out working tree that git
      # tracks, so they never end up in a commit or in this workflow's own diff/history. This is
      # specifically what keeps a real Gemini API key out of GitHub's commit-content secret
      # scanning, which auto-revokes any key it finds committed to a public repo within minutes.
      - name: Stage site with real secrets
        env:
          FIREBASE_CONFIG_JS: ${{ secrets.FIREBASE_CONFIG_JS }}
          AI_BOT_CONFIG_JS: ${{ secrets.AI_BOT_CONFIG_JS }}
        run: |
          mkdir -p _site
          shopt -s dotglob
          for item in *; do
            [ "$item" = "_site" ] && continue
            cp -r "$item" _site/
          done
          rm -rf _site/.git _site/.github
          if [ -n "$FIREBASE_CONFIG_JS" ] && [ -f _site/vr-sync-plugin/src/firebase-config.js ]; then
            printf '%s' "$FIREBASE_CONFIG_JS" > _site/vr-sync-plugin/src/firebase-config.js
          fi
          if [ -n "$AI_BOT_CONFIG_JS" ] && [ -f _site/ai-bot-plugin/src/config.js ]; then
            printf '%s' "$AI_BOT_CONFIG_JS" > _site/ai-bot-plugin/src/config.js
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
